[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "kliktahu"
version = "2.0.0"
description = "Mesin produksi & riset real-time channel YouTube KlikTahu (fakta sains & misteri)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - milik pemilik kanal KlikTahu" }
# Versi terbaru per 25 September 2026, dipin persis (hasil render & QC identik). Mesin RENDER hanya butuh 3 paket
# pertama; lapisan data/riset (kliktahu/) menambah httpx, rapidfuzz, rich. Detail: requirements.txt
dependencies = [
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.3; python_version >= '3.12'",
  "pillow==12.3.0",
  "imageio-ffmpeg==0.6.0",
  "httpx[http2]==0.28.1",
  "rapidfuzz==3.14.6",
  "rich==15.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "mypy==2.3.1"]

[project.scripts]
kliktahu = "kliktahu.__main__:main"

[tool.setuptools]
packages = ["kliktahu", "kliktahu.meta", "kliktahu.riset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: butuh internet sungguhan (tidak pernah jalan di CI; butuh --izin-live & KLIKTAHU_LIVE=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"
# mesin render lama (skrip tahap 1-7) sengaja tidak dirapikan ulang otomatis; lint ketat untuk kode baru
include = ["kliktahu/**/*.py", "tests/**/*.py", "tools/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731", "RUF001", "RUF002", "RUF003", "SIM108", "B905", "RUF012", "RUF005", "RUF007", "RUF015", "RUF046",
          "RUF059", "B007", "E741"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130   # formatter membungkus di 120; string panjang yang tak bisa dipecah boleh s.d. 130

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
# tanpa python_version: mypy memakai versi interpreter yang berjalan (stub numpy 2.5 memakai sintaks 3.12+)
files = ["kliktahu"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
